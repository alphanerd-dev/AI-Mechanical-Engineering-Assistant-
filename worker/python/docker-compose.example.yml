services:
  engineering-python-worker:
    build:
      context: .
      dockerfile: Dockerfile
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    network_mode: none
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64
