name: Prepare Native Google Provider Lock

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  prepare-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve and write the Google provider lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Upload generated package lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-google-provider-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
      - name: Install from the generated lockfile
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build and type-check
        run: npm run build
