name: Prepare Native Google Provider Lock

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  prepare-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and commit the npm lockfile on the PR branch
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          npm install --package-lock-only --ignore-scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/prepare-native-google-lock.yml
          git commit -m "chore: lock native Google AI SDK dependency"
          git push origin "HEAD:$PR_HEAD_REF"
      - name: Install exactly from the committed lockfile
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build and type-check
        run: npm run build
      - name: Verify changed chat files with ESLint
        run: npx eslint "app/api/projects/[projectId]/engineering/chat/route.ts" tests/engineering-chat-route.test.ts
