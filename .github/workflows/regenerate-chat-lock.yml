name: Regenerate chat dependency lock

on:
  push:
    branches: ["feat/chat-markdown-math-ux"]

permissions:
  contents: write

concurrency:
  group: chat-lock-regeneration
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate and audit dependency lock
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only
          npm audit --omit=dev
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): regenerate chat renderer lockfile"
          git push
