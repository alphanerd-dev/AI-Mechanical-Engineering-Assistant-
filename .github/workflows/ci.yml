name: Engineering Core CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r worker/python/requirements.txt
      - run: python -c "import sys; sys.path.insert(0, 'worker/python'); import test_worker as t; t.test_pint_conversion(); t.test_pint_dimensions(); t.test_sympy(); t.test_scipy_root(); t.test_scipy_optimize(); print('worker tests passed')"
      - name: Test build123d worker manifest
        run: python worker/cad/build123d/test_worker.py
      - name: Build pinned build123d runtime
        run: docker build --tag ai-mechanical-engineering-assistant-build123d:0.13.0 --file worker/cad/build123d/Dockerfile worker/cad
      - name: Smoke test build123d runtime
        shell: bash
        run: |
          rm -rf .cad-smoke
          mkdir -p .cad-smoke
          chmod 777 .cad-smoke
          set +e
          python worker/cad/build123d/smoke_request.py | docker run --rm -i --network none --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit 128 --memory=1g --cpus=2 --tmpfs /tmp:rw,noexec,nosuid,size=64m -e CAD_ARTIFACT_DIR=/artifacts -v "$PWD/.cad-smoke:/artifacts:rw" ai-mechanical-engineering-assistant-build123d:0.13.0 > .cad-smoke/response.json
          status=$?
          set -e
          cat .cad-smoke/response.json
          test "$status" -eq 0
          python -c 'import json; r=json.load(open(".cad-smoke/response.json")); assert r["success"] is True; assert all(r.get(k) for k in ("solidArtifactPath","stepArtifactPath","stlArtifactPath","threeMfArtifactPath")); print("build123d smoke response validated")'
          test -s .cad-smoke/part.brep
          test -s .cad-smoke/part.step
          test -s .cad-smoke/part.stl
          test -s .cad-smoke/part.3mf
      - name: Execute generated CAD from natural-language intent
        shell: bash
        run: |
          rm -rf .cad-intent-smoke
          mkdir -p .cad-intent-smoke
          chmod 777 .cad-intent-smoke
          npx tsx scripts/cad-intent-smoke-request.ts | docker run --rm -i --network none --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit 128 --memory=1g --cpus=2 --tmpfs /tmp:rw,noexec,nosuid,size=64m -e CAD_ARTIFACT_DIR=/artifacts -v "$PWD/.cad-intent-smoke:/artifacts:rw" ai-mechanical-engineering-assistant-build123d:0.13.0 > .cad-intent-smoke/response.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path(".cad-intent-smoke")
          response = json.loads((root / "response.json").read_text())
          assert response["success"] is True
          assert all(response.get(key) for key in ("solidArtifactPath", "stepArtifactPath", "stlArtifactPath", "threeMfArtifactPath"))
          assert all((root / name).is_file() and (root / name).stat().st_size > 0 for name in ("part.brep", "part.step", "part.stl", "part.3mf"))
          print("natural-language CAD intent produced BREP/STEP/STL/3MF artifacts")
          PY
      - name: Independently validate generated BREP with OpenCascade
        shell: bash
        run: |
          printf '%s' '{"artifactPath":"/artifacts/part.brep","expected":{"kind":"CYLINDER","diameterMm":30,"lengthMm":200,"toleranceMm":0.01}}' | docker run --rm -i --network none --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit 64 --memory=1g --cpus=1 --tmpfs /tmp:rw,noexec,nosuid,size=32m --user 10001:10001 --mount type=bind,src="$PWD/.cad-intent-smoke",dst=/artifacts,readonly --mount type=bind,src="$PWD/worker/cad/occt",dst=/validator,readonly --entrypoint python --pull=never ai-mechanical-engineering-assistant-build123d:0.13.0 /validator/validate_brep.py > .cad-intent-smoke/validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path(".cad-intent-smoke/validation.json").read_text())
          assert result["valid"] is True, result
          assert result["solidCount"] == 1, result
          assert result["checkedBy"] == "occt.brepcheck", result
          assert abs(result["boundingBoxMm"]["x"] - 30.0) <= 0.01, result
          assert abs(result["boundingBoxMm"]["y"] - 30.0) <= 0.01, result
          assert abs(result["boundingBoxMm"]["z"] - 200.0) <= 0.01, result
          assert result["volumeMm3"] > 0, result
          assert all(item["passed"] for item in result["dimensionChecks"]), result
          print("OpenCascade independently validated the generated BREP and requested dimensions")
          PY
      - name: End-to-end CAD intent-to-verified artifact through production provider adapters
        shell: bash
        run: |
          rm -rf .cad-completion-e2e
          mkdir -p .cad-completion-e2e
          chmod 777 .cad-completion-e2e
          npx tsx scripts/cad-completion-e2e.ts
      - name: Build pinned open FEA runtime
        run: docker build --tag ai-mechanical-engineering-assistant-fea:1.18 --file worker/fea/calculix/Dockerfile worker
      - name: Test open FEA worker
        run: docker run --rm --entrypoint python ai-mechanical-engineering-assistant-fea:1.18 /app/test_worker.py
      - name: Smoke test open FEA runtime
        shell: bash
        run: |
          rm -rf .fea-smoke
          mkdir -p .fea-smoke
          chmod 777 .fea-smoke
          set +e
          python worker/fea/calculix/smoke_request.py | docker run --rm -i --network none --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit 128 --memory=1g --cpus=2 --tmpfs /tmp:rw,nosuid,size=64m -e FEA_ARTIFACT_DIR=/artifacts -v "$PWD/.fea-smoke:/artifacts:rw" ai-mechanical-engineering-assistant-fea:1.18 > .fea-smoke/response.json
          status=$?
          set -e
          cat .fea-smoke/response.json
          test "$status" -eq 0
          python - <<'PY'
          import json
          r=json.load(open(".fea-smoke/response.json"))
          assert r["success"] is True
          assert r["analysis"]=="STATIC_STRUCTURAL"
          assert r["converged"] is True
          assert r["solver"]=="calculix"
          assert r["solverVersion"]=="2.20"
          assert r["mesh"]["nodeCount"]>0
          assert r["mesh"]["elementCount"]>0
          assert r["mesh"]["elementType"]=="C3D4"
          assert r["maxVonMisesStressMpa"]>=0
          assert r["maxDisplacementMm"]>=0
          assert len(r["artifacts"])>=4
          print("open FEA smoke response validated")
          PY
          test -s .fea-smoke/v1_18_cantilever.inp
          test -s .fea-smoke/v1_18_cantilever.dat
          test -s .fea-smoke/v1_18_cantilever.frd
          test -s .fea-smoke/v1_18_cantilever.sta
      - run: npm run build
