# Optional Codacy analysis is activated only when its repository token is configured.
# Dedicated Engineering Core CI, ESLint, and CodeQL remain independently enforced.

name: Codacy Security Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "36 18 * * 1"

permissions:
  contents: read

jobs:
  codacy-security-scan:
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check whether Codacy is configured
        id: codacy-config
        shell: bash
        run: |
          if [[ -z "${CODACY_PROJECT_TOKEN}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Codacy Security Scan"
              echo
              echo "**Status: SKIPPED.** The repository secret `CODACY_PROJECT_TOKEN` is not configured, so Codacy's remote project rules cannot be loaded. This is not a passing Codacy scan."
              echo
              echo "Engineering Core CI, ESLint, and CodeQL run independently."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Codacy scan skipped: CODACY_PROJECT_TOKEN is not configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Codacy project token is configured; starting the scan."
          fi

      - name: Run Codacy Analysis CLI
        if: steps.codacy-config.outputs.configured == 'true'
        uses: codacy/codacy-analysis-cli-action@d840f886c4bd4edc059706d09c6a1586111c540b
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      - name: Upload SARIF results file
        if: always() && steps.codacy-config.outputs.configured == 'true' && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
