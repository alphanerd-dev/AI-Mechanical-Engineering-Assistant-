name: M1 Dependency Lock Refresh (temporary)

on:
  push:
    branches:
      - feat/m1-streamed-engineering-chat
    paths-ignore:
      - package-lock.json

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.ref == 'refs/heads/feat/m1-streamed-engineering-chat'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the M1 feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/m1-streamed-engineering-chat
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve package lock from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfile to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile was already synchronized."
            exit 0
          fi
          git commit -m "chore(deps): refresh lockfile for M1 chat runtime"
          git push origin HEAD:feat/m1-streamed-engineering-chat
