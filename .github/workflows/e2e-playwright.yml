name: Playwright User Journey E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: HTTPS URL of the dedicated non-production E2E deployment only
        required: true
        type: string
      suite:
        description: Run read-only public workspace and auth-form UI smoke, or the full authenticated acceptance suite
        required: true
        type: choice
        options:
          - full
          - public-ui-smoke
        default: full
      confirm_isolated_environment:
        description: Confirm the deployment uses a dedicated E2E Supabase project and disposable test accounts, not production or shared development data
        required: true
        type: boolean
        default: false
      test_accepted_cad_completion:
        description: Opt in to a real CAD worker execution, artifact readback, atomic audit-chain verification, and cleanup in the dedicated E2E project
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# The dedicated Render worker is deliberately single-slot; never overlap real CAD E2E runs.
concurrency:
  group: engineering-assistant-isolated-playwright-e2e
  cancel-in-progress: false

jobs:
  user-journey:
    name: Auth, persistence, and ownership
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: e2e-staging
    env:
      E2E_BASE_URL: ${{ inputs.base_url }}
      E2E_SUITE: ${{ inputs.suite }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      CONFIRM_ISOLATED_ENVIRONMENT: ${{ inputs.confirm_isolated_environment }}
      E2E_RUN_ACCEPTED_CAD_SMOKE: ${{ inputs.test_accepted_cad_completion }}
      E2E_ALLOWED_HOSTS: ${{ vars.E2E_ALLOWED_HOSTS }}
      E2E_CANONICAL_BASE_URL: ${{ vars.E2E_CANONICAL_BASE_URL }}
      E2E_SUPABASE_PROJECT_REF: ${{ vars.E2E_SUPABASE_PROJECT_REF }}
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ inputs.suite != 'public-ui-smoke' && vars.E2E_SUPABASE_PUBLISHABLE_KEY || '' }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      E2E_USER_A_EMAIL: ${{ inputs.suite != 'public-ui-smoke' && secrets.E2E_USER_A_EMAIL || '' }}
      E2E_USER_A_PASSWORD: ${{ inputs.suite != 'public-ui-smoke' && secrets.E2E_USER_A_PASSWORD || '' }}
      E2E_USER_B_EMAIL: ${{ inputs.suite != 'public-ui-smoke' && secrets.E2E_USER_B_EMAIL || '' }}
      E2E_USER_B_PASSWORD: ${{ inputs.suite != 'public-ui-smoke' && secrets.E2E_USER_B_PASSWORD || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require isolated environment and validate inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_ISOLATED_ENVIRONMENT" = "true" || {
            echo "::error::Refusing to run. Explicitly confirm a dedicated non-production E2E Supabase project."
            exit 1
          }

          node <<'NODE'
          const url = new URL(process.env.E2E_BASE_URL);
          const suite = process.env.E2E_SUITE || "full";
          if (!["full", "public-ui-smoke"].includes(suite)) throw new Error("Unsupported E2E suite.");
          if (url.protocol !== "https:") throw new Error("E2E_BASE_URL must use HTTPS.");
          if (url.username || url.password || url.search || url.hash) {
            throw new Error("E2E_BASE_URL must not include credentials, a query, or a fragment.");
          }
          const canonicalValue = (process.env.E2E_CANONICAL_BASE_URL || "").trim();
          if (!canonicalValue) {
            throw new Error("E2E_CANONICAL_BASE_URL must match the preview's configured authentication redirect origin.");
          }
          const canonical = new URL(canonicalValue);
          if (canonical.protocol !== "https:" || canonical.username || canonical.password || canonical.search || canonical.hash) {
            throw new Error("E2E_CANONICAL_BASE_URL must be a clean HTTPS URL.");
          }
          if (url.origin !== canonical.origin && suite !== "public-ui-smoke") {
            throw new Error("Authenticated E2E_BASE_URL origin must match E2E_CANONICAL_BASE_URL to preserve host-scoped session cookies through authentication redirects.");
          }
          const allowedHosts = (process.env.E2E_ALLOWED_HOSTS || "")
            .split(",")
            .map((host) => host.trim().toLowerCase())
            .filter(Boolean);
          if (allowedHosts.length === 0) {
            throw new Error("Missing Actions environment variable E2E_ALLOWED_HOSTS; configure exact isolated E2E hostnames.");
          }
          if (!allowedHosts.includes(url.host.toLowerCase())) {
            throw new Error("E2E target host is not in the exact E2E_ALLOWED_HOSTS allowlist.");
          }

          if (suite === "public-ui-smoke" && process.env.E2E_RUN_ACCEPTED_CAD_SMOKE === "true") {
            throw new Error("Public UI smoke cannot opt into CAD execution.");
          }
          const e2eProject = (process.env.E2E_SUPABASE_PROJECT_REF || "").trim();
          const productionProject = (process.env.PRODUCTION_SUPABASE_PROJECT_REF || "").trim();
          const projectRefPattern = /^[a-z0-9]{20}$/;
          if (!projectRefPattern.test(e2eProject)) {
            throw new Error("E2E_SUPABASE_PROJECT_REF must be configured with the dedicated E2E Supabase project reference.");
          }
          if (!projectRefPattern.test(productionProject)) {
            throw new Error("PRODUCTION_SUPABASE_PROJECT_REF must be configured so the E2E project can be compared against it.");
          }
          if (e2eProject === productionProject) {
            throw new Error("Refusing to run: the E2E Supabase project reference equals the production project reference.");
          }

          const requiredSecrets = ["VERCEL_AUTOMATION_BYPASS_SECRET"];
          if (suite === "full") requiredSecrets.push(
            "E2E_SUPABASE_PUBLISHABLE_KEY",
            "E2E_USER_A_EMAIL", "E2E_USER_A_PASSWORD",
            "E2E_USER_B_EMAIL", "E2E_USER_B_PASSWORD"
          );
          for (const key of requiredSecrets) {
            if (!process.env[key] || !process.env[key].trim()) {
              throw new Error("Missing required GitHub Actions secret: " + key);
            }
          }
          console.log("Validated suite=" + suite + ", canonical HTTPS origin, exact allowlisted isolated host, and distinct configured E2E/production Supabase references.");
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install pinned Playwright and axe accessibility test helpers
        run: npm install --no-save --package-lock=false @playwright/test@1.64.0 @axe-core/playwright@4.13.0

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run selected Playwright acceptance suite
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$E2E_SUITE" == "public-ui-smoke" ]]; then
            npm run test:e2e -- tests/e2e/public-workspace-smoke.e2e.mjs tests/e2e/auth-responsive-layout.e2e.mjs
          else
            npm run test:e2e
          fi

      - name: Remove session-bearing Playwright trace archives before artifact upload
        id: sanitize-evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Playwright's HTML reporter copies trace ZIPs under hashed names in
          # playwright-report/data, not only as trace.zip. Any ZIP or video can
          # retain authenticated request headers or browser storage state.
          for evidence_dir in test-results playwright-report; do
            if [[ -d "$evidence_dir" ]]; then
              find "$evidence_dir" -type f \( -name '*.zip' -o -name '*.webm' \) -print -delete
            fi
          done

          # Fail closed if any raw trace archive or video remains in either
          # directory. Screenshots and sanitized Markdown diagnostics are retained.
          for evidence_dir in test-results playwright-report; do
            if [[ -d "$evidence_dir" ]] && find "$evidence_dir" -type f \( -name '*.zip' -o -name '*.webm' \) -print -quit | grep -q .; then
              echo "::error::Refusing to upload Playwright trace archives or videos."
              exit 1
            fi
          done

      - name: Upload sanitized Playwright evidence only
        if: always() && steps.sanitize-evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-evidence
          path: |
            playwright-report/
            test-results/
            !playwright-report/**/*.zip
            !playwright-report/**/*.webm
            !test-results/**/*.zip
            !test-results/**/*.webm
          if-no-files-found: warn
          retention-days: 14
