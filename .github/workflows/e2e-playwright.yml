name: Playwright User Journey E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: HTTPS URL of the allowlisted Vercel Preview deployment (do not use the production URL in shared-database mode)
        required: true
        type: string
      target_mode:
        description: Choose isolated staging (recommended) or pre-launch Preview using the current shared Supabase project
        required: true
        type: choice
        options:
          - isolated-staging
          - prelaunch-shared-supabase
        default: isolated-staging
      confirm_non_production:
        description: For isolated-staging only, confirm this uses a non-production Supabase project and dedicated test accounts
        required: true
        type: boolean
        default: false
      confirm_shared_prelaunch_database:
        description: For prelaunch-shared-supabase only, accept persistent test records in the shared database (only before real users/data)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  user-journey:
    name: Auth, persistence, and ownership
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: e2e-staging
    env:
      E2E_BASE_URL: ${{ inputs.base_url }}
      E2E_TARGET_MODE: ${{ inputs.target_mode }}
      CONFIRM_NON_PRODUCTION: ${{ inputs.confirm_non_production }}
      CONFIRM_SHARED_PRELAUNCH_DATABASE: ${{ inputs.confirm_shared_prelaunch_database }}
      E2E_ALLOWED_HOSTS: ${{ vars.E2E_ALLOWED_HOSTS }}
      E2E_USER_A_EMAIL: ${{ secrets.E2E_USER_A_EMAIL }}
      E2E_USER_A_PASSWORD: ${{ secrets.E2E_USER_A_PASSWORD }}
      E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
      E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require explicit environment confirmation and validate inputs
        run: |
          set -euo pipefail
          case "$E2E_TARGET_MODE" in
            isolated-staging)
              test "$CONFIRM_NON_PRODUCTION" = "true" || {
                echo "::error::Refusing to run. Confirm the target uses a dedicated non-production Supabase project."
                exit 1
              }
              test "$CONFIRM_SHARED_PRELAUNCH_DATABASE" != "true" || {
                echo "::error::Select only one target mode."
                exit 1
              }
              ;;
            prelaunch-shared-supabase)
              test "$CONFIRM_SHARED_PRELAUNCH_DATABASE" = "true" || {
                echo "::error::Refusing to run. Explicitly acknowledge shared-database writes in pre-launch mode."
                exit 1
              }
              echo "::warning::PRE-LAUNCH SHARED DATABASE MODE: the E2E journey will create persistent records in the Supabase project configured for this Preview deployment. Use only when no real users or important real data exist."
              ;;
            *)
              echo "::error::Unknown E2E_TARGET_MODE."
              exit 1
              ;;
          esac
          node <<'NODE'
          const url = new URL(process.env.E2E_BASE_URL);
          if (url.protocol !== "https:") throw new Error("E2E_BASE_URL must use HTTPS.");
          if (url.username || url.password || url.search || url.hash) {
            throw new Error("E2E_BASE_URL must not include credentials, a query, or a fragment.");
          }
          const allowedHosts = (process.env.E2E_ALLOWED_HOSTS || "")
            .split(",")
            .map((host) => host.trim().toLowerCase())
            .filter(Boolean);
          if (allowedHosts.length === 0) {
            throw new Error("Missing repository Actions variable E2E_ALLOWED_HOSTS; set exact non-production hostnames.");
          }
          if (!allowedHosts.includes(url.host.toLowerCase())) {
            throw new Error("E2E target host is not in the exact E2E_ALLOWED_HOSTS allowlist.");
          }
          for (const key of [
            "E2E_USER_A_EMAIL", "E2E_USER_A_PASSWORD",
            "E2E_USER_B_EMAIL", "E2E_USER_B_PASSWORD"
          ]) {
            if (!process.env[key] || !process.env[key].trim()) {
              throw new Error("Missing required GitHub Actions secret: " + key);
            }
          }
          console.log("Validated allowlisted staging target host:", url.host);
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.64.0

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end acceptance journey
        run: npm run test:e2e

      - name: Upload Playwright report, traces, screenshots, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
