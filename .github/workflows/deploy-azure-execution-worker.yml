name: Deploy Azure execution worker

on:
  workflow_dispatch:
    inputs:
      enable_schedule:
        description: "Create or update the scheduled worker after authenticated API/worker E2E checks pass"
        type: boolean
        required: true
        default: false
      disable_schedule:
        description: "Delete the scheduled worker to stop automatic runs"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: azure-execution-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: azure-execution-worker
    env:
      IMAGE: ghcr.io/alphanerd-dev/ai-mechanical-engineering-assistant-execution-worker:${{ github.sha }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-engineering-execution' }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'westeurope' }}
      AZURE_ALLOWED_LOCATIONS: ${{ vars.AZURE_ALLOWED_LOCATIONS || '' }}
      # Express environments cannot host Container Apps Jobs; use a dedicated workload-profiles environment.
      AZURE_CONTAINERAPPS_ENVIRONMENT: ${{ vars.AZURE_CONTAINERAPPS_JOBS_ENVIRONMENT || 'env-engineering-execution-jobs' }}
      AZURE_JOB_NAME: ${{ vars.AZURE_JOB_NAME || 'engineering-execution' }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://mepmogsqhxxasahwhete.supabase.co' }}
      ENABLE_SCHEDULE: ${{ inputs.enable_schedule }}
      DISABLE_SCHEDULE: ${{ inputs.disable_schedule }}

    steps:
      - name: Check required deployment configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHON_WORKER_URL: ${{ vars.PYTHON_WORKER_URL }}
          PYTHON_WORKER_API_TOKEN: ${{ secrets.PYTHON_WORKER_API_TOKEN }}
        run: |
          set -euo pipefail
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required GitHub environment variable or secret: $key"
              exit 1
            fi
          done
          if [[ "$SUPABASE_URL" != https://*.supabase.co ]]; then
            echo "::error::SUPABASE_URL must be an HTTPS Supabase project URL."
            exit 1
          fi
          if [[ -n "${PYTHON_WORKER_URL:-}" && -z "${PYTHON_WORKER_API_TOKEN:-}" ]]; then
            echo "::error::PYTHON_WORKER_URL requires the matching PYTHON_WORKER_API_TOKEN secret."
            exit 1
          fi
          if [[ -z "${PYTHON_WORKER_URL:-}" && -n "${PYTHON_WORKER_API_TOKEN:-}" ]]; then
            echo "::error::PYTHON_WORKER_API_TOKEN cannot be set without PYTHON_WORKER_URL."
            exit 1
          fi
          if [[ "$ENABLE_SCHEDULE" == "true" && "$DISABLE_SCHEDULE" == "true" ]]; then
            echo "::error::Choose either enable_schedule or disable_schedule, not both."
            exit 1
          fi
          if [[ ${#AZURE_JOB_NAME} -gt 22 || ! "$AZURE_JOB_NAME" =~ ^[a-z][a-z0-9-]*[a-z0-9]$ || "$AZURE_JOB_NAME" == *--* ]]; then
            echo "::error::AZURE_JOB_NAME must be a valid lowercase Azure name prefix of at most 22 characters; the workflow appends -manual or -scheduled."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and publish bounded execution worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: worker/execution/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}

      - name: Require a publicly pullable image before Azure deployment
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker pull "$IMAGE"

      - name: Sign in to Azure using workload identity federation
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare Azure Container Apps environment
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          az group show --name "$AZURE_RESOURCE_GROUP" --output none

          # Azure for Students region restrictions vary by subscription. The confirmed
          # sys.regionrestriction values are stored as AZURE_ALLOWED_LOCATIONS in this
          # GitHub Environment because this deployment identity cannot reliably read the
          # assignment metadata. Keep the configuration explicit and fail closed if absent.
          CONFIGURED_ALLOWED_LOCATIONS_JSON="$(jq -Rn --arg locations "$AZURE_ALLOWED_LOCATIONS" '$locations | split(",") | map(ascii_downcase | gsub("[[:space:]]"; "")) | map(select(length > 0)) | unique')"
          if [[ "$CONFIGURED_ALLOWED_LOCATIONS_JSON" == "[]" ]]; then
            echo "::error::AZURE_ALLOWED_LOCATIONS is empty. Configure it with the exact Azure region identifiers permitted by sys.regionrestriction; refusing resource creation."
            exit 1
          fi
          if ! jq -e --arg region "$AZURE_LOCATION" 'index($region | ascii_downcase) != null' <<<"$CONFIGURED_ALLOWED_LOCATIONS_JSON" >/dev/null; then
            echo "::error::Configured Azure region '$AZURE_LOCATION' is not in AZURE_ALLOWED_LOCATIONS. Permitted regions: $CONFIGURED_ALLOWED_LOCATIONS_JSON."
            exit 1
          fi
          echo "Configured subscription-permitted Azure regions: $CONFIGURED_ALLOWED_LOCATIONS_JSON"

          # When Azure Policy metadata is readable, cross-check the selected region against
          # the assignment values too. Some Azure for Students policy assignments are not
          # returned by list at subscription scope to this deployment identity; the explicit
          # environment allowlist above remains required and is never broadened automatically.
          if POLICY_JSON="$(az policy assignment list \
            --scope "/subscriptions/$AZURE_SUBSCRIPTION_ID" \
            --disable-scope-strict-match true \
            --output json 2>/dev/null)"; then
            POLICY_SUMMARY="$(jq -c '[.[] | {name: .name, displayName: .displayName, scope: .scope, policyDefinitionId: .policyDefinitionId, parameterKeys: ((.parameters // .properties.parameters // {}) | keys)}]' <<<"$POLICY_JSON")"
            echo "Applicable Azure policy assignments (metadata only): $POLICY_SUMMARY"

            POLICY_ALLOWED_LOCATIONS_JSON="$(jq -c '[
              .[]
              | (.parameters // .properties.parameters // {} | to_entries[])
              | select(.key | ascii_downcase | test("allowed.*(location|region)|(location|region).*allowed"))
              | (.value.value? // .value.defaultValue? // empty)
              | if type == "array" then .[] else . end
              | tostring | ascii_downcase | gsub("[[:space:]]"; "")
            ] | map(select(length > 0)) | unique' <<<"$POLICY_JSON")"

            if [[ "$POLICY_ALLOWED_LOCATIONS_JSON" != "[]" ]]; then
              echo "Azure Policy allowed-region values (normalized): $POLICY_ALLOWED_LOCATIONS_JSON"
              if ! jq -e --arg region "$AZURE_LOCATION" 'index($region | ascii_downcase) != null' <<<"$POLICY_ALLOWED_LOCATIONS_JSON" >/dev/null; then
                echo "::error::Azure Policy values do not allow configured region '$AZURE_LOCATION'. Policy values: $POLICY_ALLOWED_LOCATIONS_JSON. Refusing resource creation."
                exit 1
              fi
            else
              echo "::notice::Azure Policy assignment metadata exposed no allowed-location values; using the explicitly configured sys.regionrestriction allowlist for region validation."
            fi
          else
            echo "::notice::Azure Policy assignment metadata is not readable; using the explicitly configured sys.regionrestriction allowlist for region validation."
          fi

          # Azure for Students may cap Container Apps environments at one per subscription.
          # Inventory first and reuse a supported existing environment instead of blindly
          # attempting to create another. Never delete or mutate existing environments here.
          EXISTING_ENVIRONMENTS_JSON="$(az containerapp env list --output json)"
          EXISTING_ENVIRONMENT_COUNT="$(jq 'length' <<<"$EXISTING_ENVIRONMENTS_JSON")"
          ENVIRONMENT_SUMMARY="$(jq -c '[.[] | {name: .name, location: .location, resourceGroup: (.resourceGroup // ((.id // "") | split("/") | .[4])), provisioningState: (.properties.provisioningState // "unknown")}]' <<<"$EXISTING_ENVIRONMENTS_JSON")"
          echo "Existing Container Apps environments (metadata only): $ENVIRONMENT_SUMMARY"

          SELECTED_ENVIRONMENT_NAME=""
          SELECTED_ENVIRONMENT_RESOURCE_GROUP=""
          SELECTED_ENVIRONMENT_LOCATION=""
          COMPATIBLE_ENVIRONMENT_COUNT=0
          while IFS=$'\t' read -r candidate_name candidate_resource_group candidate_location candidate_state; do
            [[ -n "$candidate_name" && -n "$candidate_resource_group" && -n "$candidate_location" ]] || continue
            candidate_location="${candidate_location,,}"
            if [[ "${candidate_state,,}" != "succeeded" ]]; then
              continue
            fi
            if ! jq -e --arg location "$candidate_location" 'index($location) != null' <<<"$CONFIGURED_ALLOWED_LOCATIONS_JSON" >/dev/null; then
              continue
            fi

            candidate_profile_count="$(az containerapp env workload-profile list \\
              --name "$candidate_name" \\
              --resource-group "$candidate_resource_group" \\
              --query 'length(@)' \\
              --output tsv 2>/dev/null || true)"
            if [[ "$candidate_profile_count" =~ ^[1-9][0-9]*$ ]]; then
              COMPATIBLE_ENVIRONMENT_COUNT=$((COMPATIBLE_ENVIRONMENT_COUNT + 1))
              SELECTED_ENVIRONMENT_NAME="$candidate_name"
              SELECTED_ENVIRONMENT_RESOURCE_GROUP="$candidate_resource_group"
              SELECTED_ENVIRONMENT_LOCATION="$candidate_location"
            fi
          done < <(jq -r '.[] | [(.name // ""), (.resourceGroup // ((.id // "") | split("/") | .[4])), (.location // ""), (.properties.provisioningState // "unknown")] | @tsv' <<<"$EXISTING_ENVIRONMENTS_JSON")

          if [[ "$COMPATIBLE_ENVIRONMENT_COUNT" -gt 1 ]]; then
            echo "::error::Found more than one ready workload-profile Container Apps environment in the approved regions. Refusing to choose ambiguously."
            exit 1
          elif [[ "$COMPATIBLE_ENVIRONMENT_COUNT" -eq 1 ]]; then
            echo "::notice::Reusing existing workload-profile environment '$SELECTED_ENVIRONMENT_NAME' in approved region '$SELECTED_ENVIRONMENT_LOCATION'."
            AZURE_CONTAINERAPPS_ENVIRONMENT="$SELECTED_ENVIRONMENT_NAME"
            AZURE_RESOURCE_GROUP="$SELECTED_ENVIRONMENT_RESOURCE_GROUP"
            {
              echo "AZURE_CONTAINERAPPS_ENVIRONMENT=$AZURE_CONTAINERAPPS_ENVIRONMENT"
              echo "AZURE_RESOURCE_GROUP=$AZURE_RESOURCE_GROUP"
            } >> "$GITHUB_ENV"
          elif [[ "$EXISTING_ENVIRONMENT_COUNT" -gt 0 ]]; then
            echo "::error::The subscription already has $EXISTING_ENVIRONMENT_COUNT Container Apps environment(s), but none is both ready, workload-profile-enabled, and in an approved region. Azure for Students has a one-environment quota; no new environment was attempted and no existing environment was deleted. Review the metadata inventory above before deciding whether to retire or replace an incompatible environment."
            exit 1
          else
            echo "No existing Container Apps environment was returned. Creating the requested workload-profile environment in the configured approved region."
            az containerapp env create \\
              --name "$AZURE_CONTAINERAPPS_ENVIRONMENT" \\
              --resource-group "$AZURE_RESOURCE_GROUP" \\
              --location "$AZURE_LOCATION" \\
              --environment-mode WorkloadProfiles \\
              --only-show-errors
          fi

          # Fail early if the selected or newly created environment cannot host Container Apps Jobs.
          if ! PROFILE_COUNT="$(az containerapp env workload-profile list \\
            --name "$AZURE_CONTAINERAPPS_ENVIRONMENT" \\
            --resource-group "$AZURE_RESOURCE_GROUP" \\
            --query 'length(@)' \\
            --output tsv 2>/dev/null)" || [[ ! "$PROFILE_COUNT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The Azure Container Apps environment '$AZURE_CONTAINERAPPS_ENVIRONMENT' does not expose workload profiles and cannot host Container Apps Jobs. No existing environment was deleted."
            exit 1
          fi

      - name: Create or update the execution job
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHON_WORKER_URL: ${{ vars.PYTHON_WORKER_URL }}
          PYTHON_WORKER_API_TOKEN: ${{ secrets.PYTHON_WORKER_API_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "$ENABLE_SCHEDULE" == "true" && "$DISABLE_SCHEDULE" == "true" ]]; then
            echo "::error::Choose either enable_schedule or disable_schedule, not both."
            exit 1
          fi

          # The GitHub Environment is the source of truth for runtime configuration.
          # Python-worker settings are paired, optional, and copied to both create/update paths.
          worker_secrets=("supabase-service-role-key=$SUPABASE_SERVICE_ROLE_KEY")
          worker_env_vars=(
            "SUPABASE_URL=$SUPABASE_URL"
            "SUPABASE_SERVICE_ROLE_KEY=secretref:supabase-service-role-key"
            "EXECUTION_WORKER_MODE=drain"
            "EXECUTION_WORKER_MAX_JOBS=5"
            "EXECUTION_WORKER_MAX_RUNTIME_MS=210000"
            "EXECUTION_WORKER_LEASE_SECONDS=45"
            "EXECUTION_WORKER_HEARTBEAT_MS=10000"
          )
          if [[ -n "${PYTHON_WORKER_URL:-}" ]]; then
            worker_secrets+=("python-worker-api-token=$PYTHON_WORKER_API_TOKEN")
            worker_env_vars+=(
              "PYTHON_WORKER_URL=$PYTHON_WORKER_URL"
              "PYTHON_WORKER_API_TOKEN=secretref:python-worker-api-token"
            )
          fi

          SCHEDULED_JOB_NAME="${AZURE_JOB_NAME}-scheduled"
          if [[ "$ENABLE_SCHEDULE" == "true" ]]; then
            TRIGGER_TYPE="Schedule"
            JOB_NAME="$SCHEDULED_JOB_NAME"
          else
            TRIGGER_TYPE="Manual"
            JOB_NAME="${AZURE_JOB_NAME}-manual"
          fi

          if [[ "$DISABLE_SCHEDULE" == "true" ]]; then
            if az containerapp job show --name "$SCHEDULED_JOB_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --output none 2>/dev/null; then
              echo "Disabling the schedule by deleting the scheduled job; the manual job and its history remain untouched."
              az containerapp job delete \
                --name "$SCHEDULED_JOB_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --yes \
                --only-show-errors
            else
              echo "No scheduled job exists; nothing to disable."
            fi
          fi

          EXISTING_TRIGGER="$(az containerapp job show \
            --name "$JOB_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query 'properties.configuration.triggerType' \
            --output tsv 2>/dev/null || true)"

          # Keep Manual and Schedule jobs distinct so routine deployments never
          # delete a job or silently reset its execution history to switch modes.
          if [[ -n "$EXISTING_TRIGGER" && "$EXISTING_TRIGGER" != "$TRIGGER_TYPE" ]]; then
            echo "::error::Job $JOB_NAME exists with unexpected trigger type '$EXISTING_TRIGGER'; refusing to delete or recreate it automatically."
            exit 1
          fi

          if [[ -z "$EXISTING_TRIGGER" ]]; then
            trigger_args=(--trigger-type "$TRIGGER_TYPE")
            if [[ "$TRIGGER_TYPE" == "Schedule" ]]; then
              trigger_args+=(--cron-expression "*/5 * * * *")
            fi
            az containerapp job create \
              --name "$JOB_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --environment "$AZURE_CONTAINERAPPS_ENVIRONMENT" \
              "${trigger_args[@]}" \
              --replica-timeout 240 \
              --replica-retry-limit 1 \
              --parallelism 1 \
              --replica-completion-count 1 \
              --image "$IMAGE" \
              --cpu 0.25 \
              --memory 0.5Gi \
              --secrets "${worker_secrets[@]}" \
              --env-vars "${worker_env_vars[@]}" \
              --only-show-errors
          else
            az containerapp job secret set \
              --name "$JOB_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --secrets "${worker_secrets[@]}" \
              --only-show-errors
            az containerapp job update \
              --name "$JOB_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "$IMAGE" \
              --cpu 0.25 \
              --memory 0.5Gi \
              --replace-env-vars "${worker_env_vars[@]}" \
              --only-show-errors
          fi

          # Azure Container Apps Jobs must explicitly configure non-ACR registries,
          # including public GHCR images. Keep this in the create and update path.
          az containerapp job registry set \
            --name "$JOB_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server ghcr.io \
            --only-show-errors

          az containerapp job show \
            --name "$JOB_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query '{name:name,trigger:properties.configuration.triggerType,image:properties.template.containers[0].image,replicaTimeout:properties.configuration.replicaTimeout}' \
            --output json

          # Execute one bounded manual run when scheduling remains disabled. The worker is
          # configured in drain mode, so it exits after processing up to the bounded job limit.
          if [[ "$ENABLE_SCHEDULE" != "true" ]]; then
            EXECUTION_NAME="$(az containerapp job start \
              --name "$JOB_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --only-show-errors \
              --query name \
              --output tsv)"
            if [[ -z "$EXECUTION_NAME" ]]; then
              echo "::error::Azure did not return an execution name for the worker smoke test."
              exit 1
            fi

            echo "Started bounded manual worker smoke execution: $EXECUTION_NAME"
            EXECUTION_STATUS=""
            for attempt in $(seq 1 60); do
              EXECUTION_STATUS="$(az containerapp job execution show \
                --name "$JOB_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --job-execution-name "$EXECUTION_NAME" \
                --query 'properties.status' \
                --output tsv 2>/dev/null || true)"
              case "${EXECUTION_STATUS^^}" in
                SUCCEEDED)
                  echo "Worker smoke execution completed successfully: $EXECUTION_NAME"
                  break
                  ;;
                FAILED|STOPPED|CANCELLED|CANCELED)
                  echo "::error::Worker smoke execution ended with status '$EXECUTION_STATUS'."
                  az containerapp job execution show \
                    --name "$JOB_NAME" \
                    --resource-group "$AZURE_RESOURCE_GROUP" \
                    --job-execution-name "$EXECUTION_NAME" \
                    --output json || true
                  exit 1
                  ;;
              esac
              sleep 5
            done

            if [[ "${EXECUTION_STATUS^^}" != "SUCCEEDED" ]]; then
              echo "::error::Timed out waiting for worker smoke execution $EXECUTION_NAME; last status '$EXECUTION_STATUS'."
              az containerapp job execution show \
                --name "$JOB_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --job-execution-name "$EXECUTION_NAME" \
                --output json || true
              exit 1
            fi
          else
            echo "Skipping immediate manual execution because scheduled mode was explicitly requested."
          fi
