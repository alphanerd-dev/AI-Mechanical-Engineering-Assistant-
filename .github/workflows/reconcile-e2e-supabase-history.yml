name: Reconcile E2E Supabase Migration History

on:
  pull_request:
    paths:
      - ".github/workflows/reconcile-e2e-supabase-history.yml"
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RECONCILE_E2E_HISTORY_TO_REPOSITORY_CANONICAL to approve the metadata-only repair"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-e2e-history-reconciliation
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.98.2
      - name: Validate CLI commands and canonical migration files
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "2.98.2"
          for version in 20261007222703 20261010054845 20261012132557 20261013125414 20261013220000 20261014120000 20261014170000 20261014190000 20261015010000 20261015011000 20261017104855 20261017105801 20261021161424 20261028144952 20261028151719 20261028163543 20261101200000; do
            test -n "$(find supabase/migrations -maxdepth 1 -name "${version}_*.sql" -print -quit)"
          done
          supabase migration repair --help > "$RUNNER_TEMP/repair-help.txt"
          supabase migration list --help > "$RUNNER_TEMP/list-help.txt"
          supabase db dump --help > "$RUNNER_TEMP/dump-help.txt"
          supabase db push --help > "$RUNNER_TEMP/push-help.txt"
          grep -q -- '--status' "$RUNNER_TEMP/repair-help.txt"
          grep -q -- '--yes' "$RUNNER_TEMP/repair-help.txt"
          grep -q -- '--db-url' "$RUNNER_TEMP/repair-help.txt"
          grep -q -- '--db-url' "$RUNNER_TEMP/list-help.txt"
          grep -q -- '--db-url' "$RUNNER_TEMP/dump-help.txt"
          grep -q -- '--db-url' "$RUNNER_TEMP/push-help.txt"

  reconcile:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirmation == 'RECONCILE_E2E_HISTORY_TO_REPOSITORY_CANONICAL') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[reconcile-e2e-history]')) }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      # Fixed E2E project ref; this job cannot be redirected to production.
      E2E_PROJECT_REF: mpbrlegwrrrfpeumtqhi
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_E2E_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.98.2

      - name: Prepare fixed E2E database URL
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD" || {
            echo "::error::Missing GitHub Actions secret SUPABASE_E2E_DB_PASSWORD. Add the E2E project's database password before running this repair."
            exit 1
          }
          encoded_password="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')"
          database_url="postgresql://postgres:${encoded_password}@db.${E2E_PROJECT_REF}.supabase.co:5432/postgres?sslmode=require"
          echo "::add-mask::${database_url}"
          echo "SUPABASE_DB_URL=${database_url}" >> "$GITHUB_ENV"

      - name: Capture read-only E2E schema and migration evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p e2e-migration-history-evidence
          supabase migration list --db-url "$SUPABASE_DB_URL" \
            > e2e-migration-history-evidence/migration-list-before.txt 2>&1
          supabase db dump --db-url "$SUPABASE_DB_URL" --schema public \
            --file e2e-migration-history-evidence/public-schema-before.sql \


          # The final audited schema must already contain the production-only
          # CAD FK indexes and no point-cloud tables before metadata reconciliation.
          grep -q 'chat_title' e2e-migration-history-evidence/public-schema-before.sql
          grep -q 'message_count' e2e-migration-history-evidence/public-schema-before.sql
          grep -q 'engineering_chat_sessions_project_updated_idx' e2e-migration-history-evidence/public-schema-before.sql
          grep -q 'engineering_cad_models_project_id_id_key' e2e-migration-history-evidence/public-schema-before.sql
          grep -q 'engineering_cad_completions_created_by_idx' e2e-migration-history-evidence/public-schema-before.sql
          grep -q 'engineering_cad_completions_model_identity_id_idx' e2e-migration-history-evidence/public-schema-before.sql
          grep -q 'engineering_cad_models_created_by_idx' e2e-migration-history-evidence/public-schema-before.sql
          if grep -Eiq 'CREATE TABLE[[:space:]]+(public\.)?[^;]*(point[_-]?cloud|pointcloud)' e2e-migration-history-evidence/public-schema-before.sql; then
            echo "::error::Point-cloud tables still exist; refusing to normalize E2E history."
            exit 1
          fi

      - name: Verify exact E2E migration ledger state
        shell: bash
        run: |
          set -euo pipefail
          state="e2e-migration-history-evidence/migration-list-before.txt"
          has_remote() {
            local version="$1"
            awk -F '[│|]' -v v="$version" '
              function t(s) { gsub(/^[[:space:]]+|[[:space:]]+$/, "", s); return s }
              t($2) == v { found = 1 }
              END { exit !found }
            ' "$state"
          }
          expected=(
            20261007222703 20261010054845 20261012132557 20261013125414
            20261013220000 20261014120000 20261014170000 20261014190000
            20261015010000 20261015011000 20261017104855 20261017105801
            20261021161424 20261028144952 20261028151719 20261028163543
            20261101200000
          )
          legacy=(
            20261014062648 20261014062702 20261014062705 20261014062710
            20261014103010 20261014120544 20261014164758 20261014235057
            20261014235236 20261014235307 20261104173125
          )
          for version in "${expected[@]}"; do
            test -n "$(find supabase/migrations -maxdepth 1 -name "${version}_*.sql" -print -quit)"
          done
          for i in "${!legacy[@]}"; do
            if ! has_remote "${legacy[$i]}" && ! has_remote "${expected[$i]}"; then
              echo "::error::Neither canonical ${expected[$i]} nor E2E legacy ${legacy[$i]} exists remotely."
              exit 1
            fi
          done

      - name: Reconcile E2E history to the checked-in repository versions
        shell: bash
        run: |
          set -euo pipefail
          state="e2e-migration-history-evidence/migration-list-before.txt"
          has_remote() {
            local version="$1"
            awk -F '[│|]' -v v="$version" '
              function t(s) { gsub(/^[[:space:]]+|[[:space:]]+$/, "", s); return s }
              t($2) == v { found = 1 }
              END { exit !found }
            ' "$state"
          }
          canonical=(
            20261007222703 20261010054845 20261012132557 20261013125414
            20261013220000 20261014120000 20261014170000 20261014190000
            20261015010000 20261015011000 20261101200000
          )
          legacy=(
            20261014062648 20261014062702 20261014062705 20261014062710
            20261014103010 20261014120544 20261014164758 20261014235057
            20261014235236 20261014235307 20261104173125
          )
          for i in "${!canonical[@]}"; do
            if ! has_remote "${canonical[$i]}"; then
              supabase migration repair "${canonical[$i]}" --status applied \
                --db-url "$SUPABASE_DB_URL" --yes
            fi
            if has_remote "${legacy[$i]}"; then
              supabase migration repair "${legacy[$i]}" --status reverted \
                --db-url "$SUPABASE_DB_URL" --yes
            fi
          done

          # The index migration is already reflected in the audited E2E schema.
          if ! has_remote 20261021161424; then
            supabase migration repair 20261021161424 --status applied \
              --db-url "$SUPABASE_DB_URL" --yes
          fi

          # These E2E-only point-cloud migrations net to no objects in the audited
          # schema and have no checked-in migration files; retire their history only.
          for version in 20261021175904 20261101055943; do
            if has_remote "$version"; then
              supabase migration repair "$version" --status reverted \
                --db-url "$SUPABASE_DB_URL" --yes
            fi
          done

      - name: Verify E2E ledger equality and zero pending migrations
        shell: bash
        run: |
          set -euo pipefail
          after="e2e-migration-history-evidence/migration-list-after.txt"
          supabase migration list --db-url "$SUPABASE_DB_URL" > "$after" 2>&1
          cat "$after"
          awk -F '[│|]' '
            function t(s) { gsub(/^[[:space:]]+|[[:space:]]+$/, "", s); return s }
            /^[[:space:]]*Local/ { next }
            t($1) ~ /^[0-9]{14}$/ || t($2) ~ /^[0-9]{14}$/ {
              if (t($1) != t($2)) bad = 1
            }
            END { exit bad }
          ' "$after" || {
            echo "::error::E2E local and remote migration histories still differ."
            exit 1
          }
          supabase db push --dry-run --db-url "$SUPABASE_DB_URL" \
            > e2e-migration-history-evidence/db-push-dry-run-after.txt 2>&1
          cat e2e-migration-history-evidence/db-push-dry-run-after.txt

      - name: Capture final E2E schema evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --db-url "$SUPABASE_DB_URL" \
            > e2e-migration-history-evidence/migration-list-final.txt 2>&1 || true
          supabase db dump --db-url "$SUPABASE_DB_URL" --schema public \
            --file e2e-migration-history-evidence/public-schema-final.sql \
 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-migration-history-evidence
          path: e2e-migration-history-evidence/
          if-no-files-found: warn
          retention-days: 30
